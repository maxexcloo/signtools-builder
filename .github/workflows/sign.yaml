name: Sign

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  cancel-in-progress: false
  group: signing
  queue: max

jobs:
  sign:
    name: Sign
    # The bundled injection helper is an Intel binary.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout Builder Configuration
        uses: actions/checkout@v7
        with:
          path: builder
          persist-credentials: false
      - name: Connect To Tailscale
        uses: tailscale/github-action@v4
        with:
          audience: ${{ secrets.TS_AUDIENCE }}
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tags: tag:ephemeral
          version: latest
      - name: Check Private Connection
        run: curl --fail --show-error --silent "$SECRET_URL" >/dev/null
        env:
          SECRET_URL: ${{ secrets.SECRET_URL }}
      - name: Checkout Signing Tools
        uses: actions/checkout@v7
        with:
          path: signer
          persist-credentials: false
          # renovate: datasource=git-refs depName=https://github.com/SignTools/SignTools-CI
          ref: 8790863e64148768be9e8320c361411580d52554
          repository: SignTools/SignTools-CI
      - name: Install Fastlane
        # Pinned: bumps require re-reviewing upstream credential handling.
        # renovate: datasource=rubygems depName=fastlane
        run: gem install fastlane --conservative --minimal-deps --no-document --version 2.241.1
      - id: sign
        name: Sign App
        run: python3 ../builder/.github/scripts/run_signer.py
        working-directory: signer
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          PYTHONUNBUFFERED: "1"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECRET_URL: ${{ secrets.SECRET_URL }}
      - if: ${{ always() && (steps.sign.outcome == 'success' || steps.sign.outcome == 'failure') }}
        name: Save Apple Session
        run: python3 ../builder/.github/scripts/save_session.py
        working-directory: signer
        env:
          GH_TOKEN: ${{ secrets.SESSION_STORAGE_TOKEN }}
