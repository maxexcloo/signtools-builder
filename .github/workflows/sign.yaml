name: Sign

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  cancel-in-progress: false
  group: signing
  queue: max

jobs:
  sign:
    name: Sign
    # The bundled injection helper is an Intel binary.
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Connect To Tailscale
        uses: tailscale/github-action@v4
        with:
          audience: ${{ secrets.TS_AUDIENCE }}
          log-mode: quiet
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          tags: tag:ephemeral
          version: latest
      - name: Checkout Signing Tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # renovate: datasource=git-refs depName=https://github.com/SignTools/SignTools-CI
          ref: 8790863e64148768be9e8320c361411580d52554
          repository: SignTools/SignTools-CI
      - name: Install Fastlane
        # renovate: datasource=rubygems depName=fastlane
        run: gem install fastlane --conservative --minimal-deps --no-document --version 2.241.1
      - name: Sign App
        # Upstream diagnostics can contain account and app details.
        run: |
          if python3 sign.py >/dev/null 2>&1; then
            echo 'Signing completed.'
          else
            echo '::error::Signing failed; review the job in SignTools.'
            exit 1
          fi
        env:
          FASTLANE_OPT_OUT_USAGE: "1"
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SECRET_URL: ${{ secrets.SECRET_URL }}
      - if: ${{ !cancelled() }}
        name: Save Apple Session
        # The ephemeral runner holds at most one signed-in account.
        run: |
          cookie=$(echo "$HOME"/.fastlane/spaceship/*/cookie)
          if [ -s "$cookie" ]; then
            gh secret set FASTLANE_SESSION --repo "$GITHUB_REPOSITORY" < "$cookie" >/dev/null
            echo 'Apple session saved.'
          fi
        env:
          GH_TOKEN: ${{ secrets.SESSION_STORAGE_TOKEN }}
