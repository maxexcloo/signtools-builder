[vars]
# Remove once Actionlint recognises native concurrency queues.
actionlint_args = "-ignore 'unexpected key \"queue\" for \"concurrency\" section'"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:updates",
  "check:whitespace",
  "test:python",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]
